<!DOCTYPE html>
<html>
<head>
    <title>Perhitungan Diskon</title>
</head>
<body>
    <h1>Program Perhitungan Total Harga dengan Diskon</h1>
    <script>
        // Harga menu
        const hargaNasiGoreng = 25000;
        const hargaMieGoreng = 20000;
        const hargaAyamGoreng = 30000;

        // Menampilkan harga per item
        alert(
            "Harga Menu:\n" +
            "1. Nasi Goreng: Rp " + hargaNasiGoreng + "\n" +
            "2. Mie Goreng: Rp " + hargaMieGoreng + "\n" +
            "3. Ayam Goreng: Rp " + hargaAyamGoreng
        );

        // Input jumlah pesanan
        let jumlahNasiGoreng = parseInt(prompt("Masukkan jumlah Nasi Goreng (Rp " + hargaNasiGoreng + " per porsi): "));
        let jumlahMieGoreng = parseInt(prompt("Masukkan jumlah Mie Goreng (Rp " + hargaMieGoreng + " per porsi): "));
        let jumlahAyamGoreng = parseInt(prompt("Masukkan jumlah Ayam Goreng (Rp " + hargaAyamGoreng + " per porsi): "));

        // Hitung total sebelum diskon
        let totalSebelumDiskon = (jumlahNasiGoreng * hargaNasiGoreng) +
                                 (jumlahMieGoreng * hargaMieGoreng) +
                                 (jumlahAyamGoreng * hargaAyamGoreng);

        // Hitung diskon
        let diskon = 0;
        if (totalSebelumDiskon > 150000) {
            diskon = 0.15 * totalSebelumDiskon;
        } else if (totalSebelumDiskon > 100000) {
            diskon = 0.10 * totalSebelumDiskon;
        }

        // Hitung total setelah diskon
        let totalSetelahDiskon = totalSebelumDiskon - diskon;

        // Tampilkan hasil
        document.write("<h2>Hasil Perhitungan</h2>");
        document.write("<p>Total Sebelum Diskon: Rp " + totalSebelumDiskon + "</p>");
        document.write("<p>Diskon: Rp " + diskon + "</p>");
        document.write("<p>Total Setelah Diskon: Rp " + totalSetelahDiskon + "</p>");
    </script>
</body>
</html>
